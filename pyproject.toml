[project]
name = "ocr-platform"
version = "3.0.0"
description = "One project, two OCR services: Leasing document OCR and Paperless Cheque OCR (Gemini vision)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "logs", "postman_output", "learned_countries", "detections"]

[tool.ruff.lint]
select = ["F", "I"]
